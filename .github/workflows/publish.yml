name: Auto Version + Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # Needed to read tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # -----------------------------
    # 🔢 Calculate next version
    # -----------------------------
    - name: Determine version
      id: version
      run: |
        # Get latest tag, ignore errors
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -z "$TAG" ]; then
          echo "No existing tags, starting at 0.0.1"
          VERSION="0.0.1"
        else
          TAG=${TAG#v}  # Remove leading 'v'
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          PATCH=$((PATCH + 1))
          VERSION="$MAJOR.$MINOR.$PATCH"
        fi

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    # -----------------------------
    # 🛠️ Build + Pack
    # -----------------------------
    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Pack
      run: dotnet pack ./WorkflowyNetAPI/WorkflowyNetAPI.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o ./output
    
    # -----------------------------
    # 🔵 Publish to NuGet.org (OIDC → temp API key)
    # -----------------------------
    - name: NuGet login (OIDC → temp API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }} # set this secret to your nuget.org profile name (not email)

    - name: NuGet push
      run: dotnet nuget push "./output/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate