name: .NET Tests

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    environment: prod
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No matrix on purpose: every project targets net8.0, so a second job would
      # only duplicate the run - and both jobs would hit the same real WorkFlowy
      # account concurrently.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          WORKFLOWY_APIKEY_TEST: ${{ secrets.WORKFLOWY_APIKEY }}
          # The mirror endpoints only exist on Beta, so E2E_Mirrors fails on Production.
          WORKFLOWY_ENV_TEST: Beta
